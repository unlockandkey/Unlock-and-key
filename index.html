<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030609">
<title>Unlock & Key | Professional Locksmith</title>
<meta name="description" content="Unlock & Key professional locksmith services.">

<style>
:root{
  --bg:#030609;
  --surface:#080d12;
  --gold:#c9962d;
  --gold2:#e5b44d;
  --text:#fff;
  --muted:#aeb4bc;
  --line:rgba(255,255,255,.09);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

.container{
  width:min(1160px,calc(100% - 24px));
  margin:auto;
}

/* HEADER */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#030609;
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand img{
  width:150px;
  height:60px;
  object-fit:contain;
}

.nav-links{
  display:flex;
  gap:22px;
  margin-left:auto;
}

.nav-links a{
  font-size:12px;
  font-weight:800;
  color:#c2c7cd;
}

.call-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#6f1e00;
  color:#fff;
  padding:14px 18px;
  border-radius:14px;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
}

/* HERO */

.hero{
  padding-bottom:55px;
}

.hero-image{
  position:relative;
  width:100%;
  height:650px;
  overflow:hidden;
  background:#080d12;
  border-radius:0 0 28px 28px;
}

.hero-image img{
  position:absolute;
  width:100%;
  height:125%;
  top:-14%;
  left:0;
  max-width:none;
  object-fit:cover;
  object-position:center center;
}

/* This darkens the image without creating another ghosted image */
.hero-image:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05) 0%,
      rgba(0,0,0,.12) 35%,
      rgba(2,5,8,.96) 100%
    );
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  margin-top:-235px;
  padding:0 28px 30px;
  max-width:900px;
}

.eyebrow{
  color:var(--gold2);
  font-size:13px;
  font-weight:900;
  letter-spacing:2.5px;
  margin-bottom:14px;
}

h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.98;
  letter-spacing:-2px;
  margin-bottom:20px;
}

h1 span{
  color:var(--gold2);
}

.hero-copy{
  color:#c9ced4;
  font-size:17px;
  max-width:700px;
  margin-bottom:24px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.primary,
.secondary{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:15px 23px;
  border-radius:12px;
  font-weight:900;
}

.primary{
  background:#7a2200;
}

.secondary{
  border:1px solid rgba(229,180,77,.5);
  background:rgba(3,6,9,.85);
}

/* TRUST */

.trust-strip{
  background:#070b10;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.trust-item{
  text-align:center;
  padding:20px;
  border-right:1px solid var(--line);
}

.trust-item:last-child{
  border-right:0;
}

.trust-item strong{
  display:block;
  font-size:14px;
}

.trust-item span{
  font-size:12px;
  color:var(--muted);
}

/* SECTIONS */

section{
  padding:70px 0;
}

.section-heading{
  max-width:720px;
  margin-bottom:32px;
}

h2{
  font-size:clamp(32px,5vw,48px);
  line-height:1.08;
  margin-bottom:12px;
}

.section-heading p{
  color:var(--muted);
}

/* ABOUT */

.about-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:45px;
  align-items:center;
}

.about-photo{
  min-height:300px;
  border-radius:22px;
  border:1px solid var(--line);
  background:#080d12;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.about-photo img{
  width:270px;
  max-height:190px;
  object-fit:contain;
}

.about-copy p{
  color:var(--muted);
  margin-bottom:15px;
}

.check-list{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.check{
  font-weight:700;
  font-size:14px;
}

/* SERVICES */

.services,
.reviews{
  background:#070c11;
}

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:17px;
  padding:25px;
}

.icon{
  font-size:25px;
  margin-bottom:14px;
}

.card h3{
  font-size:19px;
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  font-size:14px;
}

/* REVIEWS */

.review-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.stars{
  color:var(--gold2);
  letter-spacing:3px;
  font-size:18px;
}

.review-box p{
  color:var(--muted);
  margin-top:5px;
}

.review-link{
  border:1px solid rgba(229,180,77,.45);
  padding:13px 18px;
  border-radius:9px;
  font-weight:800;
  white-space:nowrap;
}

/* CONTACT */

.contact-box{
  background:#080d12;
  border:1px solid var(--line);
  border-radius:24px;
  padding:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.contact-box p{
  color:var(--muted);
}

.contact-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.big-phone,
.email-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-weight:900;
  white-space:nowrap;
}

.big-phone{
  background:var(--gold);
  color:#080b0e;
  padding:16px 20px;
}

.email-button{
  border:1px solid var(--line);
  padding:15px 18px;
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  padding:28px 0;
  color:#7f8994;
  font-size:12px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

/* MOBILE */

@media(max-width:900
